<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de Preços</title>
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">Consulta rápida</p>
        <h1>Consulta de preços</h1>
        <p class="description">Pesquise pelo nome, código ou código de barras. Se preferir, leia o código com a câmera.</p>
        <button id="instalar-app" class="install-button" type="button">Instalar no Chrome</button>
        <p id="install-status" class="install-status" aria-live="polite">
          No Chrome, use o menu ⋮ e selecione "Instalar app" ou "Adicionar à tela inicial".
        </p>
      </header>

      <section class="search-panel" aria-label="Pesquisar produtos">
        <label for="busca">Produto</label>
        <div class="search-row">
          <input
            id="busca"
            type="search"
            placeholder="Digite um nome ou código"
            autocomplete="off"
            autofocus
          />
          <button id="abrir-camera" class="camera-button" type="button">Ler com a câmera</button>
        </div>
        <p id="status" class="status" aria-live="polite">Carregando produtos...</p>
        <section id="camera-panel" class="camera-panel" aria-label="Leitor de código de barras" hidden>
          <video id="camera-preview" class="camera-preview" autoplay muted playsinline></video>
          <p id="camera-status" class="camera-status" role="status" aria-live="polite"></p>
          <button id="fechar-camera" class="close-camera-button" type="button">Fechar câmera</button>
        </section>
      </section>

      <section id="produtos" class="results" aria-live="polite" aria-label="Resultados da pesquisa"></section>
    </main>

    <script src="vendor/zxing-browser.min.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
